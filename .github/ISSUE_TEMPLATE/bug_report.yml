name: バグ報告
description: 期待と違う動作や、ビルド・テストの失敗を報告する
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        再現に必要な情報を書いてください。わからない項目は空欄のままで構いません。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が問題かを一文で書いてください。
      placeholder: デコード中に CRC エラーが誤検出される
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 同じ状態をこちらで再現できる手順を書いてください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージやログがあれば貼ってください。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 関係するものだけで構いません。
      placeholder: |
        - OS:
        - コンパイラ / Rust のバージョン:
        - 対象: C / Rust / 仕様
      render: markdown
  - type: textarea
    id: context
    attributes:
      label: 補足
      description: 入力データ、スクリーンショット、関連する Issue など。
