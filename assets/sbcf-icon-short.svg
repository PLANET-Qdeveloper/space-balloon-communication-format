<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%">
  <!-- 背景（透過にしたい場合はこの行を削除してください） -->
  <rect width="200" height="200" fill="#0d1117" rx="10"/>
  
  <!-- 宇宙気球とペイロードのグラフィック -->
  <g transform="translate(15, 45)">
    <!-- バルーン -->
    <circle cx="50" cy="30" r="30" fill="none" stroke="#58a6ff" stroke-width="4"/>
    <path d="M 35 55 Q 50 70 65 55 Z" fill="#58a6ff"/>
    <!-- 紐 -->
    <line x1="40" y1="65" x2="40" y2="85" stroke="#58a6ff" stroke-width="2"/>
    <line x1="60" y1="65" x2="60" y2="85" stroke="#58a6ff" stroke-width="2"/>
    <!-- ペイロード（通信機器） -->
    <rect x="30" y="85" width="40" height="20" rx="3" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="42" cy="95" r="2" fill="#3fb950"/>
    <circle cx="58" cy="95" r="2" fill="#e34c26"/>
    
    <!-- 電波（通信フォーマット） -->
    <path d="M 100 20 Q 120 50 100 80" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
    <path d="M 115 5 Q 145 50 115 95" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
    <path d="M 130 -10 Q 170 50 130 110" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
